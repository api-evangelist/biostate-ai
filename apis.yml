aid: biostate-ai
name: Biostate AI
description: 'Biostate AI is a Houston-based precision-health biotechnology company
  combining proprietary wet-lab chemistry with generative AI to make RNA and DNA
  sequencing dramatically cheaper and more accessible. Its BIRT (Barcode-Integrated
  Reverse Transcription) plus PERD (Probes for Excess RNA Depletion) platform delivers
  Total RNA sequencing from around $60 per sample, and its N-Act and RNAstate AI
  models turn omics data into clinical insights for autoimmune, cardiovascular, and
  cancer diagnostics. The company operates a cloud data lake for AI-ready omics data
  and runs research partnerships across the U.S., India, and China. As of this profile
  Biostate publishes a marketing and publications site plus open research model
  repositories on GitHub, but exposes no public developer API, OpenAPI, SDK client
  library, or developer portal.'
